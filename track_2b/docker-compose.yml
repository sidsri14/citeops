services:
  citeops:
    build: .
    image: citeops:local
    ports:
      - "8080:8080"
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/apertus-v1.5-8b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
      CITEOPS_FIXTURE_MODE: ${CITEOPS_FIXTURE_MODE:-0}
      CITEOPS_ALLOWED_HOSTS: ${CITEOPS_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],citeops}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
